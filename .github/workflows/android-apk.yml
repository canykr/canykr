name: Android APK

# Test için kurulabilir bir APK üretir ve çalıştırma çıktısı olarak yükler.
# İndirme: GitHub > Actions > ilgili çalıştırma > Artifacts > nobetci-eczane-apk
#
# Yalnızca arm64-v8a derlenir (bkz. aşağıdaki not); test cihazı çok eski bir
# telefonsa `reactNativeArchitectures` değerine `armeabi-v7a` eklenmelidir.
#
# `release` yapısı kullanılıyor çünkü JavaScript paketi APK'nın içine gömülür;
# `debug` yapısı çalışmak için bilgisayardaki Metro sunucusuna ihtiyaç duyar.
# İmzalama, Expo şablonunun varsayılan hata ayıklama anahtarıyla yapılır:
# yan yüklemeyle test için yeterlidir, mağazaya yüklenemez.
on:
  push:
    paths:
      - 'apps/nobetci-eczane/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-latest
    # Takılan bir derlemenin altı saat runner işgal etmesini engeller.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nobetci-eczane/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Gradle bağımlılıklarını ve derleme önbelleğini saklar; ilk çalıştırmadan
      # sonraki derlemeler belirgin biçimde kısalır.
      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        working-directory: apps/nobetci-eczane
        run: npm ci

      # Yerel Android projesi depoda tutulmuyor (.gitignore'da), her derlemede
      # app.json'daki yapılandırmadan yeniden üretiliyor.
      - name: Android projesini üret
        working-directory: apps/nobetci-eczane
        run: npx expo prebuild --platform android --no-install

      # Expo şablonunun varsayılanı (512 MB metaspace) runner'da yetmiyor:
      # `compileReleaseKotlin` görevi OutOfMemoryError: Metaspace ile düşüyor.
      # Kotlin derleyicisi ayrı bir JVM'de çalıştığı için onun belleği de
      # ayrıca yükseltilmeli. Runner'da 16 GB RAM var.
      - name: Derleme belleğini yükselt
        working-directory: apps/nobetci-eczane/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      # React Native'in yerel C++ katmanı varsayılan olarak dört işlemci
      # mimarisi için derleniyor ve iki çekirdekli runner'da bu yarım saati
      # aşabiliyor. Test APK'sı için arm64-v8a yeterli: 2017 sonrası neredeyse
      # tüm Android telefonlar bu mimaride.
      - name: Gradle ile derle
        working-directory: apps/nobetci-eczane/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: nobetci-eczane-apk
          path: apps/nobetci-eczane/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
